<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/LoginStyle.css}">
    <meta charset="UTF-8">
    <title>🍕 Ramm's Pizza - Order History</title>
</head>
<body>

<div class="top-bar">
    <h1 class="bar-title">🍕 Ramm's Pizza 🍕</h1>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-button">Logout</button>
    </form>
</div>

<div class="page">
    <div class="order-card history-card">
        <h1 class="title">Order History</h1>

        <div th:if="${#lists.isEmpty(orders)}">
            <p class="order-text">No orders yet.</p>
        </div>

        <div class="cart-item" th:each="order : ${orders}">
            <h2 class="card-title" th:text="'Order #' + ${order.id}">Order #1</h2>
            <p class="order-text" th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}">Date</p>
            <p class="order-text" th:text="'Total: ' + ${order.totalPrice} + ' DKK'">Total</p>
            <p class="order-text" th:text="'Discount used: ' + ${order.discountUsed} + ' DKK'">Discount</p>
            <p class="order-text" th:text="'Points earned: ' + ${order.pointsEarned}">Points earned</p>

            <div th:each="pizza : ${order.pizzas}">
                <p class="order-text" th:text="${pizza.name + ' - ' + pizza.price + ' DKK'}">Pizza</p>
            </div>
        </div>

        <a th:href="@{/dashboard}">
            <button type="button" class="goback-button">Go back</button>
        </a>
    </div>
</div>

</body>
</html>
