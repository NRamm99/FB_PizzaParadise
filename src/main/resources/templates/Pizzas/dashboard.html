<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/LoginStyle.css}">
    <meta charset="UTF-8">
    <title>🍕 Ramm's Pizza</title>
</head>
<body>
<div class="top-bar">
    <h1 class="bar-title">🍕 Ramm's Pizza 🍕</h1>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-button">Logout</button>
    </form>
</div>

<div class="page">
    <div class="container">
        <a th:href="@{/profile}">
            <button type="button" class="index-button">Profile</button>
        </a>

        <a th:href="@{/order}">
            <button type="button" class="index-button">Make order</button>
        </a>

        <a th:href="@{/order/history}">
            <button type="button" class="index-button">Order history</button>
        </a>
    </div>
</div>

</body>
</html>
