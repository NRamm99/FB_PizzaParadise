<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/LoginStyle.css}">
    <meta charset="UTF-8">
    <title>🍕 Ramm's Pizza - Receipt</title>
</head>
<body>

<div class="top-bar">
    <h1 class="bar-title">🍕 Ramm's Pizza 🍕</h1>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-button">Logout</button>
    </form>
</div>

<div class="page">
    <div class="container receipt-container">
        <h1 class="title">Receipt</h1>

        <p class="order-text" th:text="'Order ID: ' + ${order.id}">Order ID</p>
        <p class="order-text" th:text="'Placed: ' + ${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}">Date</p>

        <div class="cart-item" th:each="pizza : ${order.pizzas}">
            <h2 class="card-title" th:text="${pizza.name}">Pizza</h2>
            <p class="order-text" th:text="${pizza.price + ' DKK'}">80 DKK</p>
            <p class="order-text">
                Toppings:
                <span th:text="${#lists.isEmpty(pizza.toppings) ? 'None' : #strings.listJoin(pizza.toppings, ', ')}"></span>
            </p>
        </div>

        <p class="cart-total" th:text="'Discount used: ' + ${order.discountUsed} + ' DKK'">Discount used: 0 DKK</p>
        <p class="cart-total" th:text="'Points spent: ' + ${order.pointsSpent}">Points spent: 0</p>
        <p class="cart-total" th:text="'Points earned: ' + ${order.pointsEarned}">Points earned: 0</p>
        <p class="cart-total" th:text="'Total paid: ' + ${order.totalPrice} + ' DKK'">Total paid: 0 DKK</p>

        <a th:href="@{/dashboard}">
            <button type="button" class="goback-button">Back to dashboard</button>
        </a>
    </div>
</div>

</body>
</html>
